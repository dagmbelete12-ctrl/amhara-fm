<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amhara FM Debre Birhan - Live</title>
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #f8f9fa;
            --dark: #212529;
            --accent: #dc3545;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--secondary);
            color: var(--dark);
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 26px;
        }
        header p {
            margin: 8px 0 0 0;
            font-size: 15px;
            opacity: 0.9;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 40px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .card h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 15px;
            font-size: 22px;
        }
        .player-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            margin: 30px 0;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
            letter-spacing: 1px;
        }
        .player-btn:hover {
            transform: scale(1.05);
            background-color: #c82333;
        }
        .status {
            font-weight: bold;
            color: #6c757d;
            font-size: 16px;
        }
        .playing {
            color: #28a745;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        footer {
            text-align: center;
            padding: 20px;
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: var(--dark);
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>አምሃራ ኤፍኤም ደብረ ብርሃን | Amhara FM Debre Birhan</h1>
        <p>የአማራ ሚዲያ ኮርፖሬชั่น (AMECO) አባል</p>
    </header>

    <div class="container">
        <!-- Audio Player Card -->
        <div class="card">
            <h2>ቀጥታ ስርጭት (Live Audio Player)</h2>
            <p>በቀጥታ ለማዳመጥ ማጫወቻውን ይጫኑ</p>
            
            <button class="player-btn" id="playBtn" onclick="togglePlay()">▶ PLAY RADIO</button>
            
            <div class="status" id="statusText">የአሁኑ ሁኔታ: ቆሟል (Paused)</div>
            
            <!-- Hidden Audio Element -->
            <audio id="radioStream" src="https://link.zeno.fm/eq5nw5e8vp8uv" preload="none"></audio>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Amhara Media Corporation (AMECO). All Rights Reserved.</p>
    </footer>

    <script>
        const audio = document.getElementById('radioStream');
        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');

        function togglePlay() {
            if (audio.paused) {
                // Reload stream to prevent playing stale cached audio
                audio.load(); 
                audio.play()
                    .then(() => {
                        playBtn.innerText = "⏸ PAUSE RADIO";
                        statusText.innerText = "የአሁኑ ሁኔታ: እየተጫወተ ነው... (Playing Live)";
                        statusText.className = "status playing";
                    })
                    .catch(err => {
                        console.error("Playback failed:", err);
                        statusText.innerText = "ስህተት: ስርጭቱ አልተገኘም (Error: Stream unavailable)";
                    });
            } else {
                audio.pause();
                playBtn.innerText = "▶ PLAY RADIO";
                statusText.innerText = "የአሁኑ ሁኔታ: ቆሟል (Paused)";
                statusText.className = "status";
            }
        }
    </script>
</body>
</html>
